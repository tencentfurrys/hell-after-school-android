name: v44 probe - locate Cocos2d direct-inject entry points

# v43 log proved: precedeTriggered/Released is a no-op on arm64.  Only handleKeyDown
# reaches the engine, but arm64 libMyGame.so has a broken Android->Cocos2d
# translation table (Space/D/dpad translate, A/Shift/Ctrl don't).
#
# This probe is READ-ONLY.  It commits three artefacts to mod64/logs/v44_probe/:
#   1. list of every Cocos2d-org Java class present in classes.dex + which of
#      them expose a keycode/event method we could call directly
#   2. full smali of Cocos2dxRenderer / Cocos2dxHelper / EventDispatcher-like
#      classes so we can pick the right reflection target
#   3. strings from libMyGame.so filtered for Cocos2d key symbols + the
#      InputManager surface so we can find the LUT

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_TAG: v42-controls
      BASE_APK_NAME: FOBS_v42.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { ref: main }

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }

      - name: Download base APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_APK_NAME" --output /tmp/base.apk

      - name: Extract dex + so
        run: |
          set -e
          curl -fsSL -o /tmp/baksmali.jar \
            https://github.com/baksmali/smali/releases/download/3.0.9/baksmali-3.0.9-fat.jar
          mkdir -p /tmp/dex /tmp/apk
          unzip -o -q /tmp/base.apk classes.dex -d /tmp/dex
          unzip -o -q /tmp/base.apk 'lib/arm64-v8a/libMyGame.so' -d /tmp/apk
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/dex/classes.dex -o /tmp/smali

      - name: Inventory Cocos2d Java surface
        run: |
          set -e
          mkdir -p mod64/logs/v44_probe
          {
            echo "########## every org/cocos2dx class present ##########"
            find /tmp/smali/org/cocos2dx -name '*.smali' | sort
            echo
            echo "########## methods that look like input entry points ##########"
            grep -rInE '\.method .*(handleKey|dispatchKey|notifyGamePad|notifyKey|onKey|nativeKey|nativeInject|nativeGamePad|dispatchInput|inputEvent)' \
              /tmp/smali/org/cocos2dx 2>/dev/null | head -80
            echo
            echo "########## native declarations in cocos2dx ##########"
            grep -rInE '\.method .*native' /tmp/smali/org/cocos2dx 2>/dev/null | head -60
            echo
            echo "########## static access to Renderer/Helper/EventDispatcher ##########"
            grep -rInE 'Cocos2dxHelper|Cocos2dxRenderer|Cocos2dxGLSurfaceView|EventDispatcher|InputHelper' \
              /tmp/smali/org/cocos2dx 2>/dev/null | grep -v ".smali:" | head -80
          } > mod64/logs/v44_probe/01_java_surface.txt

      - name: Dump renderer + helper + surfaceview smali
        run: |
          set -e
          for f in Cocos2dxRenderer Cocos2dxHelper Cocos2dxGLSurfaceView Cocos2dxJavascriptJavaBridge Cocos2dxActivity; do
            src=$(find /tmp/smali/org/cocos2dx -name "${f}.smali" | head -1)
            if [ -n "$src" ]; then
              cp "$src" mod64/logs/v44_probe/${f}.smali.txt
              echo "captured $f"
            fi
          done
          # every method signature in Cocos2dxHelper + Renderer (fast index)
          {
            echo "### Cocos2dxHelper method signatures ###"
            grep -E '^\.method' mod64/logs/v44_probe/Cocos2dxHelper.smali.txt 2>/dev/null || true
            echo
            echo "### Cocos2dxRenderer method signatures ###"
            grep -E '^\.method' mod64/logs/v44_probe/Cocos2dxRenderer.smali.txt 2>/dev/null || true
            echo
            echo "### Cocos2dxGLSurfaceView method signatures ###"
            grep -E '^\.method' mod64/logs/v44_probe/Cocos2dxGLSurfaceView.smali.txt 2>/dev/null || true
          } > mod64/logs/v44_probe/02_method_index.txt

      - name: Extract Cocos2d keycode + input strings from libMyGame.so
        run: |
          set -e
          SO=/tmp/apk/lib/arm64-v8a/libMyGame.so
          {
            echo "########## Cocos2d keycode enum strings ##########"
            strings "$SO" | grep -iE '^KEY_[A-Z0-9_]+$|EventKeyboard|KeyCode|kKeyCode|keyPressed|keyReleased' | sort -u | head -200
            echo
            echo "########## InputManager surface ##########"
            strings "$SO" | grep -iE 'InputManager|inputMapping|operationKey|pressOperationKey|releaseOperationKey|pressed|released' | sort -u | head -100
            echo
            echo "########## handleKey / notifyGamePad symbols ##########"
            strings "$SO" | grep -iE 'handleKey|nativeKey|nativeGamePad|dispatchKey|onKey|keyboardEvent|dispatchTouchEvent' | sort -u | head -100
            echo
            echo "########## AGTK operation-key names (Japanese friendly) ##########"
            strings "$SO" | grep -iE 'メニュー|Menu|Attack|Dash|Jump|Shoot|Action|Operation' | sort -u | head -60
          } > mod64/logs/v44_probe/03_so_strings.txt

      - name: Also snapshot GamepadOverlay.stdKeyInject verbatim
        run: |
          set -e
          awk '/\.method .*stdKeyInject/,/\.end method/' /tmp/smali/org/cocos2dx/cpp/GamepadOverlay.smali \
            > mod64/logs/v44_probe/04_stdKeyInject.smali.txt || true
          wc -l mod64/logs/v44_probe/04_stdKeyInject.smali.txt

      - name: Commit
        run: |
          set -e
          git config user.name probe-bot
          git config user.email probe@local
          git add mod64/logs/v44_probe
          git commit -m "v44 probe: Cocos2d direct-inject entry points" || echo "nothing to commit"
          git push origin main
