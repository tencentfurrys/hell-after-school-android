name: v42c controls padBtn fix (attack/dash/menu) - both inner classes

# v42c fixes the 3 dead buttons (Attack X, Dash C, Collectible-menu V).
#
# Root cause (proven by input.log): those 3 are the ONLY overlay buttons with
# padBtn >= 0, so alongside their keyboard inject they ALSO fire padInject() -> a
# virtual gamepad button. PGMMV then treats the gamepad as the active input
# source for that frame; nothing is bound to those pad-button indices, so the
# action never triggers and the keyboard inject (which WOULD trigger it) is
# dropped. Every WORKING button uses padBtn = -1 (keyboard path only).
#
# v42/v42b mistake: patched GamepadOverlay$1 only. The live runtime path is
# GamepadOverlay$2 (its log line has NO "(static)" suffix; $1's does, and
# "(static)" never appears in the user's log). So padInject kept firing.
#
# v42c fix: neutralise the padInject branch (iget val$padBtn / if-ltz -> goto)
# in BOTH $1 and $2. $2 is the one that matters. A hard post-package check
# decompiles the FINAL packaged classes.dex and FAILS the build if padInject is
# still reachable in $2, so a broken APK can never be published again.
#
# Base APK = v41 release (physics cpFloat fix + full controls). Swap ONLY
# classes.dex; native libs copied byte-for-byte.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_TAG: v41-controls
      BASE_APK_NAME: FOBS_v41.apk
      OVERLAY_1: 'org/cocos2dx/cpp/GamepadOverlay$1.smali'
      OVERLAY_2: 'org/cocos2dx/cpp/GamepadOverlay$2.smali'
      SMALI_API: '23'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }

      - name: Download base APK (v41 release asset)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_APK_NAME" --output /tmp/base.apk
          echo "base APK: $(stat -c%s /tmp/base.apk) bytes, md5 $(md5sum /tmp/base.apk | cut -d' ' -f1)"
          unzip -l /tmp/base.apk | grep -q "lib/arm64-v8a/libMyGame.so"   || { echo "ERROR: base missing libMyGame.so"; exit 1; }
          unzip -l /tmp/base.apk | grep -q "lib/arm64-v8a/libmenushim.so" || { echo "ERROR: base missing libmenushim.so"; exit 1; }
          echo "base carries libMyGame.so + libmenushim.so"

      - name: Fetch baksmali + smali (runnable fat jars)
        run: |
          set -e
          for j in baksmali smali; do
            curl -fsSL -o /tmp/$j.jar \
              "https://github.com/baksmali/smali/releases/download/3.0.9/$j-3.0.9-fat.jar"
          done
          java -jar /tmp/baksmali.jar --version 2>&1 | head -1

      - name: Extract + baksmali classes.dex
        run: |
          set -e
          mkdir -p /tmp/dex
          unzip -o -q /tmp/base.apk classes.dex -d /tmp/dex
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/dex/classes.dex -o /tmp/smali
          test -f "/tmp/smali/$OVERLAY_2" || { echo "ERROR: $OVERLAY_2 not found (live path!)"; exit 1; }
          echo "live overlay present: /tmp/smali/$OVERLAY_2"
          echo "--- \$2 guard BEFORE ---"; grep -nE 'val..padBtn:I|if-ltz|goto |access..100' "/tmp/smali/$OVERLAY_2" | head

      - name: Apply v42c padBtn patch to BOTH inner classes
        run: |
          set -e
          # $2 is the live path and MUST patch. $1 is a fallback; patch if present.
          python3 mod64/scripts/v42_patch_overlay_padbtn.py "/tmp/smali/$OVERLAY_2"
          if [ -f "/tmp/smali/$OVERLAY_1" ]; then
            python3 mod64/scripts/v42_patch_overlay_padbtn.py "/tmp/smali/$OVERLAY_1" || echo "note: \$1 patch skipped/failed (non-fatal)"
          fi

      - name: Reassemble patched dex
        run: |
          set +e
          java -Xmx3g -jar /tmp/smali.jar assemble -a "$SMALI_API" /tmp/smali -o /tmp/dex/classes_patched.dex 2>/tmp/asm_err.txt
          RC=$?
          set -e
          echo "smali assemble rc=$RC"; cat /tmp/asm_err.txt || true
          if [ "$RC" -ne 0 ] || [ ! -s /tmp/dex/classes_patched.dex ]; then
            echo "ERROR: smali assemble failed"; exit 1
          fi
          echo "patched dex: $(stat -c%s /tmp/dex/classes_patched.dex) bytes"

      - name: Repackage APK (swap classes.dex only)
        run: |
          set -e
          python3 - /tmp/dex/classes_patched.dex /tmp/base.apk /tmp/v42_unaligned.apk <<'PY'
          import sys, zipfile
          patched_dex, base, out = sys.argv[1], sys.argv[2], sys.argv[3]
          dex_bytes = open(patched_dex, "rb").read()
          zin = zipfile.ZipFile(base, "r"); zout = zipfile.ZipFile(out, "w")
          replaced = False
          for info in zin.infolist():
              raw = dex_bytes if info.filename == "classes.dex" else zin.read(info.filename)
              if info.filename == "classes.dex": replaced = True
              zi = zipfile.ZipInfo(info.filename, date_time=info.date_time)
              zi.compress_type = info.compress_type
              zi.external_attr = info.external_attr
              zi.internal_attr = info.internal_attr
              zi.create_system = info.create_system
              zi.flag_bits     = info.flag_bits
              zout.writestr(zi, raw)
          zout.close(); zin.close()
          if not replaced: print("ERROR: classes.dex not found"); sys.exit(1)
          print("repackaged", out, "dex", len(dex_bytes))
          PY

      - name: HARD verify - padInject unreachable in $2 of the FINAL apk
        run: |
          set -e
          # Decompile the dex from the ACTUAL packaged apk, not an intermediate.
          rm -rf /tmp/final_dex /tmp/final_smali
          mkdir -p /tmp/final_dex
          unzip -o -q /tmp/v42_unaligned.apk classes.dex -d /tmp/final_dex
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/final_dex/classes.dex -o /tmp/final_smali
          V="/tmp/final_smali/$OVERLAY_2"
          test -f "$V" || { echo "VERIFY-FAIL: \$2 missing from final dex"; exit 1; }
          echo "--- \$2 guard AFTER (final apk) ---"; grep -nE 'val..padBtn:I|if-ltz|goto |access..100' "$V" | head
          python3 - "$V" <<'PY'
          import re, sys
          s = open(sys.argv[1]).read()
          # find the padBtn guard: iget vN ...val$padBtn:I  then next real op
          m = re.search(r"iget\s+(v\d+),\s*p0,[^\n]*val.padBtn:I\s*\n(?:\s*\.line\s+\d+\s*\n)?\s*(\S+)([^\n]*)", s)
          if not m:
              print("VERIFY-FAIL: padBtn guard site not found in $2"); sys.exit(1)
          nextop = m.group(2)
          if nextop.startswith("if-ltz"):
              print("VERIFY-FAIL: if-ltz still gates padInject in $2 (patch did NOT apply)"); sys.exit(1)
          if not nextop.startswith("goto"):
              print("VERIFY-FAIL: unexpected op after padBtn iget:", nextop); sys.exit(1)
          print("VERIFY-OK: $2 padBtn guard =", nextop, m.group(3).strip(), "-> padInject unreachable")
          PY

      - name: Zipalign + sign (v1+v2+v3)
        run: |
          set -e
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)"
          "${BT}zipalign" -p -f 4 /tmp/v42_unaligned.apk /tmp/v42_aligned.apk
          "${BT}apksigner" sign \
            --ks mod64/signing/fobs.keystore \
            --ks-key-alias fobs \
            --ks-pass pass:fobsmod --key-pass pass:fobsmod \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/FOBS_v42.apk /tmp/v42_aligned.apk
          "${BT}apksigner" verify --min-sdk-version 23 /tmp/FOBS_v42.apk && echo "SIGN OK"
          ls -l /tmp/FOBS_v42.apk

      - name: Attach APK to GitHub release (v42-controls, clobber)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          if gh release view v42-controls --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v42-controls /tmp/FOBS_v42.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v42-controls /tmp/FOBS_v42.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "FOBS v42 (attack/dash/menu fix)" \
              --notes "Fixes the 3 dead buttons. Neutralises padInject in BOTH GamepadOverlay inner classes (\$2 is the live path). Hard-verified padInject unreachable in the final dex. Keeps v41 physics fix."
          fi

      - name: Write result log
        run: |
          set -e
          APK_MD5="$(md5sum /tmp/FOBS_v42.apk | cut -d' ' -f1)"
          APK_SIZE="$(stat -c%s /tmp/FOBS_v42.apk)"
          REL_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v42-controls/FOBS_v42.apk"
          mkdir -p mod64/logs
          { echo "v42c build result ($(date -u +%FT%TZ))";
            echo "RELEASE_URL: $REL_URL";
            echo "APK_MD5: $APK_MD5";
            echo "APK_SIZE: $APK_SIZE";
            echo "NOTE: padInject verified unreachable in \$2 of final dex"; } > mod64/logs/v42_result.txt
          cat mod64/logs/v42_result.txt

      - name: Commit result log
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mod64/logs/v42_result.txt
          git commit -m "v42c build result [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:main
