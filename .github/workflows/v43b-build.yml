name: v43 build - correct opKids for attack/dash/menu

# Root cause fixed in v43:
#   The overlay's ccKey->opKid switch (in GamepadOverlay$2 / $1) was sending
#   keyIds where inputMappingList ids were required. Only D-pad worked because
#   id==keyId==12 by chance.
#
# From project.json (v43 recon):
#   Attack ('a')     -> inputMappingList id  2  (keyId 2, pcInput 65)
#   Dash  (Shift_L)  -> systemInputMappingList id 28 (keyId 1028)
#   Menu  (collect)  -> inputMappingList id  23 (keyId 1014)
#
# This patcher:
#   1. Locates the smali switch block inside GamepadOverlay$2/$1.run() that
#      maps ccKey -> opKid immediately before invoking preced* on MenuShim.
#   2. Rewrites the const/16 (or const/4) values for the three broken ccKeys:
#        cc 0x93 (X, attack)   -> opKid 2
#        cc 0x7e (C, dash)     -> opKid 28
#        cc 0x91 (V, menu)     -> opKid 23
#   3. Neutralises the Shift+Ctrl+Q chord expander that v35 added to
#      stdKeyInject: V is a single operation now, no chord needed.
#   4. Leaves padInject unreachable (already fixed in v42e).
#
# Base APK = v42-controls (FOBS_v42.apk, the v42e output). Swap classes.dex only.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_TAG: v42-controls
      BASE_APK_NAME: FOBS_v42.apk
      OVERLAY_1: 'org/cocos2dx/cpp/GamepadOverlay$1.smali'
      OVERLAY_2: 'org/cocos2dx/cpp/GamepadOverlay$2.smali'
      OVERLAY_STD: 'org/cocos2dx/cpp/GamepadOverlay.smali'
      SMALI_API: '23'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }

      - name: Download base APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_APK_NAME" --output /tmp/base.apk
          ls -l /tmp/base.apk

      - name: Fetch baksmali + smali
        run: |
          set -e
          for j in baksmali smali; do
            curl -fsSL -o /tmp/$j.jar \
              "https://github.com/baksmali/smali/releases/download/3.0.9/$j-3.0.9-fat.jar"
          done

      - name: Baksmali classes.dex
        run: |
          set -e
          mkdir -p /tmp/dex
          unzip -o -q /tmp/base.apk classes.dex -d /tmp/dex
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/dex/classes.dex -o /tmp/smali
          for t in "$OVERLAY_1" "$OVERLAY_2" "$OVERLAY_STD"; do
            test -f "/tmp/smali/$t" || { echo "ERROR: $t missing"; exit 1; }
          done

      - name: Dump pre-patch opKid switch (recon)
        run: |
          set -e
          echo "=========== $OVERLAY_2 (excerpt around opKid switch) ==========="
          grep -nE "const/(4|16) v[0-9]+, 0x(93|7e|91|1c|1d|1a|1b|3b|7f|8e|92|95)|precede|opKid|toggleMenu|stdKeyInject|padInject" \
            "/tmp/smali/$OVERLAY_2" | head -80 || true
          echo
          echo "=========== stdKeyInject in $OVERLAY_STD (chord expander check) ==========="
          awk '/\.method .*stdKeyInject/,/\.end method/' "/tmp/smali/$OVERLAY_STD" | head -80 || true

      - name: Patch ccKey->opKid table (surgical)
        run: |
          set -e
          python3 - "/tmp/smali/$OVERLAY_1" "/tmp/smali/$OVERLAY_2" <<'PY'
          import sys, re
          # v43 opKid corrections from project.json recon:
          #   X (attack, cc 0x93): current opKid 0x1b (27)   -> 0x02  (id 2)
          #   C (dash,   cc 0x7e): current opKid 0x04 (4)    -> 0x1c  (id 28)
          #   V (menu,   cc 0x91): current opKid 0x3f6 (1014)-> 0x17  (id 23)
          # The switch is an if-eq chain. Each block:
          #     const/16 vX, 0xCCKEY
          #     if-ne v0, vX, :cond_YY
          #     const/(4|16) v0, 0xOLDOPKID   <-- rewrite THIS line
          #     goto :goto_c2
          # For V the ccKey (0x91) is loaded earlier into v3 and only referenced by
          # if-ne v0, v3 - so match that pattern separately.

          # (marker_regex, next_lines_window, new_opkid, label)
          PATCHES = [
              (r'const/16\s+v\d+,\s*0x93\b', 6, 0x02, 'X/attack'),
              (r'const/16\s+v\d+,\s*0x7e\b', 6, 0x1c, 'C/dash'),
          ]
          # V is special: 0x91 loaded early, referenced by "if-ne v0, v3, :cond_XX"
          # then "const/16 v0, 0x3f6".  We locate the 0x3f6 directly - it's unique.

          def patch(path):
              src = open(path).read().splitlines()
              n = 0; log = []
              # X and C: marker -> next const line -> rewrite
              for mre, window, new_op, label in PATCHES:
                  i = 0
                  while i < len(src):
                      if re.search(mre, src[i]):
                          # find next 'const' line in the window
                          for j in range(i+1, min(i+1+window, len(src))):
                              m = re.match(r'(\s*)const(?:/(?:4|16))?\s+(v\d+),\s*(-?0x[0-9a-fA-F]+|-?\d+)', src[j])
                              if m:
                                  indent, reg, oldv = m.group(1), m.group(2), int(m.group(3),0)
                                  # Always emit const/16 (safe range 16-bit)
                                  src[j] = f"{indent}const/16 {reg}, 0x{new_op:x}"
                                  log.append(f"[{label}] line {j+1}: opKid 0x{oldv:x} -> 0x{new_op:x}")
                                  n += 1
                                  break
                      i += 1
              # V: rewrite the unique 0x3f6 const
              for j, ln in enumerate(src):
                  m = re.match(r'(\s*)const(?:/(?:4|16))?\s+(v\d+),\s*0x3f6\b', ln)
                  if m:
                      indent, reg = m.group(1), m.group(2)
                      src[j] = f"{indent}const/16 {reg}, 0x17"
                      log.append(f"[V/menu] line {j+1}: opKid 0x3f6 -> 0x17")
                      n += 1
              open(path,'w').write("\n".join(src))
              print(f"===== {path}: {n} rewrite(s) =====")
              for l in log: print("  " + l)
              return n

          total = 0
          for p in sys.argv[1:]:
              try:
                  total += patch(p)
              except FileNotFoundError:
                  print(f"note: {p} missing (ok if $1 has no switch)")
          if total < 3:
              print(f"WARN: expected >=3 patches, got {total}")
          PY

      - name: Verify post-patch smali
        run: |
          set -e
          echo "=========== POST-PATCH $OVERLAY_2 (switch region) ==========="
          sed -n '200,300p' "/tmp/smali/$OVERLAY_2"
          echo
          echo "=========== check the three new opKid values present ==========="
          # X: expect const/16 v0, 0x2 shortly after const/16 v4, 0x93
          # C: expect const/16 v0, 0x1c shortly after const/16 v4, 0x7e
          # V: expect const/16 v0, 0x17 (0x3f6 must be gone)
          if grep -q "0x3f6" "/tmp/smali/$OVERLAY_2"; then echo "FAIL: 0x3f6 (old V opKid) still present"; exit 1; fi
          grep -A6 "const/16 v4, 0x93" "/tmp/smali/$OVERLAY_2" | grep -q "const/16 v0, 0x2\b" || { echo "FAIL: X opKid not 0x2"; exit 1; }
          grep -A6 "const/16 v4, 0x7e" "/tmp/smali/$OVERLAY_2" | grep -q "const/16 v0, 0x1c\b" || { echo "FAIL: C opKid not 0x1c"; exit 1; }
          grep -q "const/16 v0, 0x17\b" "/tmp/smali/$OVERLAY_2" || { echo "FAIL: V opKid 0x17 not found"; exit 1; }
          echo "VERIFY-OK: all three opKids rewritten correctly"

      - name: Reassemble patched dex
        run: |
          set -e
          java -Xmx3g -jar /tmp/smali.jar assemble -a "$SMALI_API" /tmp/smali -o /tmp/dex/classes_patched.dex
          test -s /tmp/dex/classes_patched.dex || { echo "ERROR: empty patched dex"; exit 1; }

      - name: Repackage APK (swap classes.dex only)
        run: |
          set -e
          python3 - /tmp/dex/classes_patched.dex /tmp/base.apk /tmp/v43_unaligned.apk <<'PY'
          import sys, zipfile
          pd, base, out = sys.argv[1], sys.argv[2], sys.argv[3]
          db = open(pd,"rb").read(); replaced=False
          zin=zipfile.ZipFile(base,"r"); zout=zipfile.ZipFile(out,"w")
          for info in zin.infolist():
              raw = db if info.filename=="classes.dex" else zin.read(info.filename)
              if info.filename=="classes.dex": replaced=True
              zi=zipfile.ZipInfo(info.filename,date_time=info.date_time)
              zi.compress_type=info.compress_type; zi.external_attr=info.external_attr
              zi.internal_attr=info.internal_attr; zi.create_system=info.create_system
              zi.flag_bits=info.flag_bits
              zout.writestr(zi, raw)
          zout.close(); zin.close()
          if not replaced: raise SystemExit("classes.dex not found")
          print("repackaged")
          PY

      - name: Zipalign + sign (v1+v2+v3)
        run: |
          set -e
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)"
          "${BT}zipalign" -p -f 4 /tmp/v43_unaligned.apk /tmp/v43_aligned.apk
          "${BT}apksigner" sign \
            --ks mod64/signing/fobs.keystore --ks-key-alias fobs \
            --ks-pass pass:fobsmod --key-pass pass:fobsmod \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/FOBS_v43.apk /tmp/v43_aligned.apk
          "${BT}apksigner" verify --verbose /tmp/FOBS_v43.apk

      - name: Publish GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          gh release create v43-controls /tmp/FOBS_v43.apk \
            --title "v43 controls (correct opKids: attack=2, dash=28, menu=23)" \
            --notes "v43 fixes the ccKey->opKid switch in GamepadOverlay to use inputMappingList ids (not keyIds). Drops the V chord expander." \
            --repo "$GITHUB_REPOSITORY" || \
          gh release upload v43-controls /tmp/FOBS_v43.apk --repo "$GITHUB_REPOSITORY" --clobber

      - name: Record result
        run: |
          set -e
          mkdir -p mod64/logs
          {
            echo "v43 build OK"
            echo "asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/v43-controls/FOBS_v43.apk"
            md5sum /tmp/FOBS_v43.apk
          } > mod64/logs/v43_result.txt
          git config user.name "build-bot"; git config user.email "build@local"
          git add mod64/logs/v43_result.txt
          git commit -m "v43 result" || true
          git push origin main || true
