name: v36 real-input-path build v4 + package

# v36 wires ALL on-screen overlay buttons into the ONLY input channel the
# arm64 engine actually polls per frame: InputManager::getInputDataRaw()
# ->registerKeyPressed/Released(cc, 0). See mod64/src/menushim.cpp.
#
# Two changes on top of the v35 crash-fixed engine:
#   1. Rebuild arm64 libmenushim.so with v36 injectKey semantics + rich probe.
#   2. Smali-patch GamepadOverlay$2 to remove the (cc == 0x91) gate so the
#      overlay's existing MenuShim.injectKey(cc, pressed) call fires for
#      every button, not just V.
#
# Base APK is the v35 release asset (identical v34 arm64 engine), fetched
# with the workflow token so no expired litterbox link can break the build.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_TAG: v35-controls
      BASE_APK_NAME: FOBS_v35.apk
      OVERLAY_INNER: 'org/cocos2dx/cpp/GamepadOverlay$2.smali'
      SMALI_API: '23'
      NDK_VERSION: r25c
      NDK_ARCHIVE: android-ndk-r25c-linux.zip
      NDK_URL: https://dl.google.com/android/repository/android-ndk-r25c-linux.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download base APK (v35 release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_APK_NAME" --output /tmp/base.apk
          echo "base APK: $(stat -c%s /tmp/base.apk) bytes, md5 $(md5sum /tmp/base.apk | cut -d' ' -f1)"

      - name: Fetch NDK r25c
        run: |
          set -e
          curl -fsSL -o /tmp/ndk.zip "$NDK_URL"
          unzip -q /tmp/ndk.zip -d /tmp
          echo "NDK_ROOT=/tmp/android-ndk-$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build arm64 libmenushim.so (v36)
        run: |
          set -e
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          CXX="$TC/bin/aarch64-linux-android21-clang++"
          "$CXX" --version | head -1
          mkdir -p /tmp/out
          set +e
          "$CXX" \
            -std=c++17 \
            -fPIC -O2 -fvisibility=hidden -shared -static-libstdc++ \
            -Wl,-soname,libmenushim.so \
            -o /tmp/out/libmenushim.so \
            mod64/src/menushim_v36.cpp \
            -llog -ldl -lm 2>/tmp/compile.err
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "=== COMPILE FAILED (rc=$rc) ==="
            cat /tmp/compile.err
            echo "=== SOURCE HEAD ==="
            sed -n '55,75p' mod64/src/menushim_v36.cpp
            echo "=== END DIAG ==="
            mkdir -p mod64/logs
            cp /tmp/compile.err mod64/logs/v36_compile_error.txt
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mod64/logs/v36_compile_error.txt
            git commit -m "v36 compile error dump [skip ci]" || true
            git push origin HEAD:main || true
            exit $rc
          fi
          echo "built libmenushim.so:"
          ls -l /tmp/out/libmenushim.so
          if ! strings /tmp/out/libmenushim.so | grep -q "_ZN12InputDataRaw18registerKeyPressedEii"; then
            echo "ERROR: libmenushim.so does not reference registerKeyPressed symbol string"; exit 1
          fi
          if ! strings /tmp/out/libmenushim.so | grep -q "_ZN12InputDataRaw19registerKeyReleasedEii"; then
            echo "ERROR: libmenushim.so does not reference registerKeyReleased symbol string"; exit 1
          fi
          if ! strings /tmp/out/libmenushim.so | grep -q "v36 injectKey PRESS"; then
            echo "ERROR: libmenushim.so missing v36 log markers"; exit 1
          fi
          echo "libmenushim.so v36 markers OK"

      - name: Fetch baksmali + smali (runnable fat jars)
        run: |
          set -e
          for j in baksmali smali; do
            curl -fsSL -o /tmp/$j.jar \
              "https://github.com/baksmali/smali/releases/download/3.0.9/$j-3.0.9-fat.jar"
          done
          java -jar /tmp/baksmali.jar --version 2>&1 | head -1
          java -jar /tmp/smali.jar     --version 2>&1 | head -1

      - name: Extract + baksmali classes.dex
        run: |
          set -e
          mkdir -p /tmp/dex
          unzip -o -q /tmp/base.apk classes.dex -d /tmp/dex
          echo "dex: $(stat -c%s /tmp/dex/classes.dex) bytes"
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/dex/classes.dex -o /tmp/smali
          test -f "/tmp/smali/$OVERLAY_INNER" || { echo "ERROR: $OVERLAY_INNER not found"; exit 1; }
          echo "overlay inner present: /tmp/smali/$OVERLAY_INNER"

      - name: Apply v36 overlay patch
        run: |
          set -e
          python3 mod64/scripts/patch_overlay_v36.py "/tmp/smali/$OVERLAY_INNER"

      - name: Reassemble + verify patched dex
        run: |
          set -e
          java -Xmx3g -jar /tmp/smali.jar assemble -a "$SMALI_API" /tmp/smali -o /tmp/dex/classes_patched.dex
          echo "patched dex: $(stat -c%s /tmp/dex/classes_patched.dex) bytes"
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/dex/classes_patched.dex -o /tmp/verify
          V="/tmp/verify/$OVERLAY_INNER"
          grep -q "v36: gate removed" "$V" || { echo "VERIFY-FAIL: v36 marker missing in patched overlay"; exit 1; }
          grep -q "->injectKey(IZ)Z" "$V" || { echo "VERIFY-FAIL: MenuShim.injectKey call missing"; exit 1; }
          if grep -Eq "^\s*if-ne\s+v[0-9]+,\s*v[0-9]+,\s*:cond_[0-9a-f]+.*# gate.*0x91" "$V"; then
            echo "VERIFY-FAIL: old if-ne gate still active"; exit 1
          fi
          echo "VERIFY-OK: patched dex carries v36 overlay change"

      - name: Repackage APK (patched dex + arm64 libmenushim.so)
        run: |
          set -e
          python3 - /tmp/dex/classes_patched.dex /tmp/out/libmenushim.so /tmp/base.apk /tmp/v36_unaligned.apk <<'PY'
          import sys, zipfile
          patched_dex, new_so, base, out = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          dex_bytes = open(patched_dex, "rb").read()
          so_bytes  = open(new_so,       "rb").read()
          target_dex = "classes.dex"
          target_so  = "lib/arm64-v8a/libmenushim.so"

          zin = zipfile.ZipFile(base, "r")
          zout = zipfile.ZipFile(out, "w")
          replaced_dex = False
          replaced_so  = False
          for info in zin.infolist():
              if info.filename == target_dex:
                  raw = dex_bytes; replaced_dex = True
              elif info.filename == target_so:
                  raw = so_bytes;  replaced_so  = True
              else:
                  raw = zin.read(info.filename)
              zi = zipfile.ZipInfo(info.filename, date_time=info.date_time)
              # Force STORED for the .so so page-alignment via zipalign -p 4 works.
              zi.compress_type = zipfile.ZIP_STORED if info.filename == target_so else info.compress_type
              zi.external_attr = info.external_attr
              zi.internal_attr = info.internal_attr
              zi.create_system = info.create_system
              zi.flag_bits     = info.flag_bits
              zout.writestr(zi, raw)
          zout.close(); zin.close()
          if not replaced_dex: print("ERROR: classes.dex not found in base"); sys.exit(1)
          if not replaced_so:  print("WARN : lib/arm64-v8a/libmenushim.so not in base APK; v7a-only build!"); sys.exit(1)
          print("repackaged", out, "dex", len(dex_bytes), "so", len(so_bytes))
          PY
          ls -l /tmp/v36_unaligned.apk

      - name: Zipalign + sign (v1+v2+v3)
        run: |
          set -e
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)"
          echo "build-tools: $BT"
          "${BT}zipalign" -p -f 4 /tmp/v36_unaligned.apk /tmp/v36_aligned.apk
          "${BT}apksigner" sign \
            --ks mod64/signing/fobs.keystore \
            --ks-key-alias fobs \
            --ks-pass pass:fobsmod --key-pass pass:fobsmod \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/FOBS_v36.apk /tmp/v36_aligned.apk
          "${BT}apksigner" verify --min-sdk-version 23 /tmp/FOBS_v36.apk && echo "SIGN OK"
          ls -l /tmp/FOBS_v36.apk

      - name: Attach APK to GitHub release (stable link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view v36-controls --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v36-controls /tmp/FOBS_v36.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v36-controls /tmp/FOBS_v36.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "FOBS v36 (real input-path controls)" \
              --notes "arm64 controls fix: MenuShim.injectKey routes to InputManager->InputDataRaw->registerKeyPressed/Released (the ONLY channel the engine polls). Overlay smali gate removed so every button fires. Rich probe logs isPressedKeyboard per press."
          fi

      - name: Publish to litterbox + write char-spaced result log
        run: |
          set -e
          up() { curl -fsS -F reqtype=fileupload -F time=72h -F "fileToUpload=@$1" \
                 https://litterbox.catbox.moe/resources/internals/api.php; }
          APK_URL="$(up /tmp/FOBS_v36.apk || true)"
          APK_MD5="$(md5sum /tmp/FOBS_v36.apk | cut -d' ' -f1)"
          APK_SIZE="$(stat -c%s /tmp/FOBS_v36.apk)"
          REL_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v36-controls/FOBS_v36.apk"
          { echo "## v36 real-input build";
            echo "- litterbox APK: $APK_URL";
            echo "- release APK: $REL_URL";
            echo "- size: $APK_SIZE  md5: $APK_MD5"; } >> "$GITHUB_STEP_SUMMARY"
          spaced() { printf '%s' "$1" | sed 's/./& /g'; }
          mkdir -p mod64/logs
          {
            echo "v36 real-input build result ($(date -u +%FT%TZ))"
            echo "APK_URL_SPACED: $(spaced "$APK_URL")"
            echo "RELEASE_URL_SPACED: $(spaced "$REL_URL")"
            echo "APK_MD5_SPACED: $(spaced "$APK_MD5")"
            echo "APK_SIZE: $APK_SIZE"
          } > mod64/logs/v36_result.txt
          cat mod64/logs/v36_result.txt

      - name: Commit result log
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mod64/logs/v36_result.txt
          git commit -m "v36 build result [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:main
