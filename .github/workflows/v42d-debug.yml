name: v42d debug - dump final $2 smali after patch round-trip

# Diagnosis only. Patches $2 (+$1) padBtn guard, reassembles, repackages,
# then decompiles the FINAL packaged dex and COMMITS the GamepadOverlay$2
# run()-region smali so we can see what the assemble->disassemble round-trip
# actually produced around the padBtn guard. Does NOT sign or publish.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_TAG: v41-controls
      BASE_APK_NAME: FOBS_v41.apk
      OVERLAY_1: 'org/cocos2dx/cpp/GamepadOverlay$1.smali'
      OVERLAY_2: 'org/cocos2dx/cpp/GamepadOverlay$2.smali'
      SMALI_API: '23'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }

      - name: Download base APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_APK_NAME" --output /tmp/base.apk

      - name: Fetch baksmali + smali
        run: |
          set -e
          for j in baksmali smali; do
            curl -fsSL -o /tmp/$j.jar \
              "https://github.com/baksmali/smali/releases/download/3.0.9/$j-3.0.9-fat.jar"
          done

      - name: Baksmali + patch + reassemble + repackage
        run: |
          set -e
          mkdir -p /tmp/dex
          unzip -o -q /tmp/base.apk classes.dex -d /tmp/dex
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/dex/classes.dex -o /tmp/smali
          python3 mod64/scripts/v42_patch_overlay_padbtn.py "/tmp/smali/$OVERLAY_2"
          if [ -f "/tmp/smali/$OVERLAY_1" ]; then
            python3 mod64/scripts/v42_patch_overlay_padbtn.py "/tmp/smali/$OVERLAY_1" || true
          fi
          # snapshot of the patched (pre-round-trip) $2 guard for comparison
          cp "/tmp/smali/$OVERLAY_2" /tmp/pre_$2.smali 2>/dev/null || cp "/tmp/smali/$OVERLAY_2" /tmp/pre_dollar2.smali
          java -Xmx3g -jar /tmp/smali.jar assemble -a "$SMALI_API" /tmp/smali -o /tmp/dex/classes_patched.dex
          python3 - /tmp/dex/classes_patched.dex /tmp/base.apk /tmp/v42_unaligned.apk <<'PY'
          import sys, zipfile
          pd, base, out = sys.argv[1], sys.argv[2], sys.argv[3]
          db = open(pd,"rb").read()
          zin=zipfile.ZipFile(base,"r"); zout=zipfile.ZipFile(out,"w")
          for info in zin.infolist():
              raw = db if info.filename=="classes.dex" else zin.read(info.filename)
              zi=zipfile.ZipInfo(info.filename,date_time=info.date_time)
              zi.compress_type=info.compress_type; zi.external_attr=info.external_attr
              zi.internal_attr=info.internal_attr; zi.create_system=info.create_system
              zi.flag_bits=info.flag_bits
              zout.writestr(zi, raw)
          zout.close(); zin.close(); print("repackaged")
          PY

      - name: Decompile FINAL dex and commit $2 run-region
        run: |
          set -e
          rm -rf /tmp/final_dex /tmp/final_smali
          mkdir -p /tmp/final_dex
          unzip -o -q /tmp/v42_unaligned.apk classes.dex -d /tmp/final_dex
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/final_dex/classes.dex -o /tmp/final_smali
          V="/tmp/final_smali/$OVERLAY_2"
          mkdir -p mod64/logs
          {
            echo "=== v42d $(date -u +%FT%TZ) FINAL dex GamepadOverlay\$2 run() region ==="
            echo "--- grep guard markers ---"
            grep -nE 'val..padBtn:I|if-ltz|goto |access..100|:cond_' "$V" || true
            echo "--- full run() method ---"
            awk '/\.method public run\(\)V/{p=1} p{print} /\.end method/ && p{exit}' "$V"
          } > mod64/logs/v42d_dump.txt
          echo "wrote dump ($(wc -l < mod64/logs/v42d_dump.txt) lines)"

      - name: Commit dump
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mod64/logs/v42d_dump.txt
          git commit -m "v42d debug dump [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:main
