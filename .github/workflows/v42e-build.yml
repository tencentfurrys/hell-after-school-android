name: v42e controls padBtn fix (attack/dash/menu) - FINAL

# v42e is the corrected, publishing build.
#
# Confirmed via v42d dump: patching GamepadOverlay$2 turns the padBtn guard
#   iget vN ...val$padBtn:I ; if-ltz vN, :L ; <padInject> ; :L <keyboard>
# into
#   iget vN ...val$padBtn:I ; goto :L ; <padInject unreachable> ; :L <keyboard>
# so padInject never fires. $2 is the LIVE runtime path (its "inject fired"
# log has no "(static)" suffix). v42/v42b wrongly patched $1 only, so padInject
# kept firing; v42c built correctly but a buggy verify regex (it matched the
# logging iget, not the guard iget) false-failed before publish. v42e fixes the
# verify to scan every padBtn iget and only flag ones whose next real op is
# if-ltz. Patches BOTH $1 and $2.
#
# Base APK = v41 release (physics fix + controls). Swap ONLY classes.dex.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_TAG: v41-controls
      BASE_APK_NAME: FOBS_v41.apk
      OVERLAY_1: 'org/cocos2dx/cpp/GamepadOverlay$1.smali'
      OVERLAY_2: 'org/cocos2dx/cpp/GamepadOverlay$2.smali'
      SMALI_API: '23'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }

      - name: Download base APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_APK_NAME" --output /tmp/base.apk
          unzip -l /tmp/base.apk | grep -q "lib/arm64-v8a/libMyGame.so"   || { echo "ERROR: base missing libMyGame.so"; exit 1; }
          unzip -l /tmp/base.apk | grep -q "lib/arm64-v8a/libmenushim.so" || { echo "ERROR: base missing libmenushim.so"; exit 1; }

      - name: Fetch baksmali + smali
        run: |
          set -e
          for j in baksmali smali; do
            curl -fsSL -o /tmp/$j.jar \
              "https://github.com/baksmali/smali/releases/download/3.0.9/$j-3.0.9-fat.jar"
          done

      - name: Baksmali classes.dex
        run: |
          set -e
          mkdir -p /tmp/dex
          unzip -o -q /tmp/base.apk classes.dex -d /tmp/dex
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/dex/classes.dex -o /tmp/smali
          test -f "/tmp/smali/$OVERLAY_2" || { echo "ERROR: $OVERLAY_2 (live path) not found"; exit 1; }

      - name: Patch padBtn guard in BOTH inner classes
        run: |
          set -e
          python3 mod64/scripts/v42_patch_overlay_padbtn.py "/tmp/smali/$OVERLAY_2"
          if [ -f "/tmp/smali/$OVERLAY_1" ]; then
            python3 mod64/scripts/v42_patch_overlay_padbtn.py "/tmp/smali/$OVERLAY_1" || echo "note: \$1 patch skipped (non-fatal)"
          fi

      - name: Reassemble patched dex
        run: |
          set -e
          java -Xmx3g -jar /tmp/smali.jar assemble -a "$SMALI_API" /tmp/smali -o /tmp/dex/classes_patched.dex
          test -s /tmp/dex/classes_patched.dex || { echo "ERROR: empty patched dex"; exit 1; }

      - name: Repackage APK (swap classes.dex only)
        run: |
          set -e
          python3 - /tmp/dex/classes_patched.dex /tmp/base.apk /tmp/v42_unaligned.apk <<'PY'
          import sys, zipfile
          pd, base, out = sys.argv[1], sys.argv[2], sys.argv[3]
          db = open(pd,"rb").read(); replaced=False
          zin=zipfile.ZipFile(base,"r"); zout=zipfile.ZipFile(out,"w")
          for info in zin.infolist():
              raw = db if info.filename=="classes.dex" else zin.read(info.filename)
              if info.filename=="classes.dex": replaced=True
              zi=zipfile.ZipInfo(info.filename,date_time=info.date_time)
              zi.compress_type=info.compress_type; zi.external_attr=info.external_attr
              zi.internal_attr=info.internal_attr; zi.create_system=info.create_system
              zi.flag_bits=info.flag_bits
              zout.writestr(zi, raw)
          zout.close(); zin.close()
          if not replaced: print("ERROR: classes.dex not found"); sys.exit(1)
          print("repackaged")
          PY

      - name: HARD verify padInject unreachable in $2 of FINAL apk
        run: |
          set -e
          rm -rf /tmp/final_dex /tmp/final_smali; mkdir -p /tmp/final_dex
          unzip -o -q /tmp/v42_unaligned.apk classes.dex -d /tmp/final_dex
          java -Xmx3g -jar /tmp/baksmali.jar disassemble /tmp/final_dex/classes.dex -o /tmp/final_smali
          V="/tmp/final_smali/$OVERLAY_2"
          test -f "$V" || { echo "VERIFY-FAIL: \$2 missing"; exit 1; }
          python3 - "$V" <<'PY'
          import re, sys
          lines = open(sys.argv[1]).read().splitlines()
          bad = good = 0
          for i, l in enumerate(lines):
              if re.search(r'iget\s+v\d+,\s*p0,.*val.padBtn:I', l):
                  j = i + 1
                  while j < len(lines):
                      t = lines[j].strip()
                      if (not t) or t.startswith('.line') or t.startswith('#') or t.startswith(':'):
                          j += 1; continue
                      break
                  nxt = lines[j].strip() if j < len(lines) else ''
                  if nxt.startswith('if-ltz'):  bad += 1
                  elif nxt.startswith('goto'):  good += 1
                  # otherwise it's the logging iget (next op invoke-virtual) -> ignore
          if bad:
              print("VERIFY-FAIL: %d if-ltz padBtn guard(s) still gate padInject" % bad); sys.exit(1)
          if good < 1:
              print("VERIFY-FAIL: no goto-neutralised padBtn guard found in $2"); sys.exit(1)
          print("VERIFY-OK: $2 padBtn guard neutralised (goto=%d, if-ltz=%d) -> padInject unreachable" % (good, bad))
          PY

      - name: Zipalign + sign (v1+v2+v3)
        run: |
          set -e
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)"
          "${BT}zipalign" -p -f 4 /tmp/v42_unaligned.apk /tmp/v42_aligned.apk
          "${BT}apksigner" sign \
            --ks mod64/signing/fobs.keystore \
            --ks-key-alias fobs \
            --ks-pass pass:fobsmod --key-pass pass:fobsmod \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/FOBS_v42.apk /tmp/v42_aligned.apk
          "${BT}apksigner" verify --min-sdk-version 23 /tmp/FOBS_v42.apk && echo "SIGN OK"
          ls -l /tmp/FOBS_v42.apk

      - name: Publish to v42-controls release (clobber)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          if gh release view v42-controls --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v42-controls /tmp/FOBS_v42.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v42-controls /tmp/FOBS_v42.apk --repo "$GITHUB_REPOSITORY" \
              --title "FOBS v42 (attack/dash/menu fix)" \
              --notes "Neutralises padInject in the LIVE overlay path (GamepadOverlay\$2). Hard-verified padInject unreachable in final dex. Keeps v41 physics fix."
          fi

      - name: Write + commit result log
        run: |
          set -e
          APK_MD5="$(md5sum /tmp/FOBS_v42.apk | cut -d' ' -f1)"
          APK_SIZE="$(stat -c%s /tmp/FOBS_v42.apk)"
          REL_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v42-controls/FOBS_v42.apk"
          mkdir -p mod64/logs
          { echo "v42e build result ($(date -u +%FT%TZ))";
            echo "RELEASE_URL: $REL_URL";
            echo "APK_MD5: $APK_MD5";
            echo "APK_SIZE: $APK_SIZE";
            echo "padInject verified UNREACHABLE in \$2 (live path)"; } > mod64/logs/v42_result.txt
          cat mod64/logs/v42_result.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mod64/logs/v42_result.txt
          git commit -m "v42e build result [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:main
