name: Build arm64 Engine

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Player/**'
      - '.github/workflows/build-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build arm64-v8a
        working-directory: Player/proj.android-studio/app
        env:
          NDK_MODULE_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}/sources
        run: |
          echo "NDK path: ${{ steps.setup-ndk.outputs.ndk-path }}"
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build \
            NDK_DEBUG=0 \
            APP_ABI=arm64-v8a \
            -j$(nproc) \
            V=0

      - name: Verify output
        run: |
          ls -la Player/proj.android-studio/app/libs/arm64-v8a/libMyGame.so
          file Player/proj.android-studio/app/libs/arm64-v8a/libMyGame.so
          readelf -h Player/proj.android-studio/app/libs/arm64-v8a/libMyGame.so | grep -E "Class|Machine"

      - name: Upload libMyGame.so
        uses: actions/upload-artifact@v4
        with:
          name: libMyGame-arm64-r25c
          path: Player/proj.android-studio/app/libs/arm64-v8a/libMyGame.so
          retention-days: 30
