name: boot-test
on:
  workflow_dispatch:
  release:
    types: [published, edited]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh release download boot-apk -R ${{ github.repository }} -p '*.apk' -D apk
          ls -la apk

      - name: AVD boot test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: |
            set -x
            adb devices
            echo "=== device ABIs ==="
            adb shell getprop ro.product.cpu.abilist
            APKF=$(ls apk/*.apk | head -1)
            echo "Installing $APKF"
            adb install -r -g "$APKF" 2>&1 | tee install.txt || adb install -r "$APKF" 2>&1 | tee -a install.txt
            PKG=com.sthdk.forestblueskin
            adb logcat -c || true
            echo "=== launching ==="
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1 2>&1 | tee launch.txt || true
            sleep 50
            adb logcat -d > logcat_full.txt 2>&1 || true
            adb logcat -d -b crash > crash.txt 2>&1 || true
            grep -iE "$PKG|MyGame|cocos|AndroidRuntime|FATAL|libc |DEBUG|menushim|GLES|EGL|SIGSEGV|UnsatisfiedLink|dlopen|abort" logcat_full.txt > logcat_filtered.txt 2>&1 || true
            adb exec-out screencap -p > screen.png 2>/dev/null || true
            echo "=== running? ==="
            (adb shell pidof $PKG && echo STILL_RUNNING || echo NOT_RUNNING) | tee running.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-results
          path: |
            install.txt
            launch.txt
            running.txt
            logcat_filtered.txt
            logcat_full.txt
            crash.txt
            screen.png
          if-no-files-found: warn
